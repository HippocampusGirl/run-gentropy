[workspace]
authors = ["Lea Waller <lea@lea.science>"]
channels = ["conda-forge", "bioconda"]
name = "gentropy"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
download-refs = "bash download_references.sh"
l2g = "python run_locus2gene.py all"

[dependencies]
python = "3.12.*"
openjdk = "11.*"
scipy = "==1.17.1"
wget = "*"

[pypi-dependencies]
gentropy = "==3.4.0"
